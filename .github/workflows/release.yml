name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goosarch:
          - linux/arm
          - linux/arm64
          - linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build info
        id: buildinfo
        run: |
          GOOSARCH="${{ matrix.goosarch }}"
          GOOS="${GOOSARCH%%/*}"
          GOARCH="${GOOSARCH##*/}"
          BINARY_NAME="checkuser-${GOOS}-${GOARCH}"
          echo "goos=${GOOS}"   >> "$GITHUB_OUTPUT"
          echo "goarch=${GOARCH}" >> "$GITHUB_OUTPUT"
          echo "binary=${BINARY_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS:        ${{ steps.buildinfo.outputs.goos }}
          GOARCH:      ${{ steps.buildinfo.outputs.goarch }}
          CGO_ENABLED: 0
          TAG:         ${{ github.ref_name }}
        run: |
          # Remove o 'v' prefix da tag (v1.0.4 → 1.0.4) pra injetar em main.version
          VER="${TAG#v}"
          go build -trimpath \
            -ldflags="-s -w -buildid= -X main.version=${VER}" \
            -o "${{ steps.buildinfo.outputs.binary }}" ./src

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.buildinfo.outputs.binary }}
